name: tech-curse

services:
  postgres:
    image: public.ecr.aws/docker/library/postgres:17
    environment:
      POSTGRES_DB: APITechCurse
      POSTGRES_USER: ${POSTGRES_USER:?defina POSTGRES_USER no .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    ports:
      - 127.0.0.1:5432:5432
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U \"$$POSTGRES_USER\" -d APITechCurse"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: public.ecr.aws/docker/library/redis:7
    ports:
      - 127.0.0.1:6379:6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrar:
    build: .
    image: ${API_IMAGE:-tech-curse-api:dev}
    command: ["migrar"]
    env_file: .env
    environment: &conexoes
      ConnectionStrings__APITechCurse: "Host=postgres;Port=5432;Database=APITechCurse;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      ConnectionStrings__RedisCache: "redis:6379"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    image: ${API_IMAGE:-tech-curse-api:dev}
    env_file: .env
    environment: *conexoes
    ports:
      - 127.0.0.1:5130:8080
    depends_on:
      migrar:
        condition: service_completed_successfully
    stop_grace_period: 30s

volumes:
  postgres:
