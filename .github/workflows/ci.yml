name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', 'Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore TechCurse.slnx

      - name: Build
        run: dotnet build TechCurse.slnx --configuration Release --no-restore -p:TreatWarningsAsErrors=true

      - name: Formatação
        run: dotnet format TechCurse.slnx --verify-no-changes --no-restore

      - name: Imagens de teste
        run: |
          for imagem in public.ecr.aws/docker/library/postgres:17 public.ecr.aws/docker/library/redis:7; do
            for tentativa in 1 2 3; do
              docker pull --quiet "$imagem" && break
              [ "$tentativa" -eq 3 ] && exit 1
              sleep $((tentativa * 10))
            done
          done

      - name: Testes
        run: dotnet test --solution TechCurse.slnx --configuration Release --no-build --results-directory TestResults --coverage --coverage-output-format cobertura

      - name: Cobertura
        run: |
          dotnet tool restore
          dotnet reportgenerator "-reports:TestResults/**/*.cobertura.xml" -targetdir:TestResults/relatorio -reporttypes:MarkdownSummaryGithub "-assemblyfilters:+TechCurse.*;-TechCurse.*Tests" "-classfilters:-TechCurse.Infrastructure.Migrations.*"
          cat TestResults/relatorio/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Rastreabilidade
        if: ${{ !cancelled() }}
        run: python3 scripts/rastreabilidade.py >> "$GITHUB_STEP_SUMMARY"
