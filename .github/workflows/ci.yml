name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Restore
        run: dotnet restore TechCurse.slnx --locked-mode

      - name: Build
        run: dotnet build TechCurse.slnx --configuration Release --no-restore -p:TreatWarningsAsErrors=true

      - name: Formatação
        run: dotnet format TechCurse.slnx --verify-no-changes --no-restore

      - name: Testes
        run: dotnet test TechCurse.slnx --configuration Release --no-build
