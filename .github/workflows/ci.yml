name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', 'Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore TechCurse.slnx

      - name: Build
        run: dotnet build TechCurse.slnx --configuration Release --no-restore -p:TreatWarningsAsErrors=true

      - name: Formatação
        run: dotnet format TechCurse.slnx --verify-no-changes --no-restore

      - id: semana
        run: echo "valor=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ~/imagens-de-apoio.tar
          key: imagens-de-apoio-${{ hashFiles('scripts/imagens-de-apoio.sh') }}-${{ steps.semana.outputs.valor }}

      - name: Imagens de apoio
        run: scripts/imagens-de-apoio.sh ~/imagens-de-apoio.tar

      - name: Testes
        run: dotnet test --solution TechCurse.slnx --configuration Release --no-build --results-directory TestResults --coverage --coverage-output-format cobertura

      - name: Cobertura
        run: |
          dotnet tool restore
          dotnet reportgenerator "-reports:TestResults/**/*.cobertura.xml" -targetdir:TestResults/relatorio -reporttypes:MarkdownSummaryGithub "-assemblyfilters:+TechCurse.*;-TechCurse.*Tests" "-classfilters:-TechCurse.Infrastructure.Migrations.*"
          cat TestResults/relatorio/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Rastreabilidade
        if: ${{ !cancelled() }}
        run: python3 scripts/rastreabilidade.py --estrito >> "$GITHUB_STEP_SUMMARY"

  imagem:
    name: imagem
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      API_IMAGE: tech-curse-api:ci
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build da imagem
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ${{ env.API_IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: .env descartável
        run: |
          senha_banco=$(openssl rand -hex 24)
          chave_jwt=$(openssl rand -base64 48 | tr -d '\n')
          senha_admin="Aa1!$(openssl rand -hex 12)"
          echo "::add-mask::$senha_banco"
          echo "::add-mask::$chave_jwt"
          echo "::add-mask::$senha_admin"
          sed -e "s|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=$senha_banco|" \
              -e "s|^Jwt__SigningKey=.*|Jwt__SigningKey=$chave_jwt|" \
              -e "s|^Seed__Admin__Email=.*|Seed__Admin__Email=admin@ci.test|" \
              -e "s|^Seed__Admin__Password=.*|Seed__Admin__Password=$senha_admin|" \
              .env.example > .env

      - id: semana
        run: echo "valor=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ~/imagens-de-apoio.tar
          key: imagens-de-apoio-${{ hashFiles('scripts/imagens-de-apoio.sh') }}-${{ steps.semana.outputs.valor }}

      - name: Imagens de apoio
        run: scripts/imagens-de-apoio.sh ~/imagens-de-apoio.tar

      - name: Subir o compose
        run: docker compose up --detach --no-build --wait --wait-timeout 180

      - name: Verificar o contêiner
        run: scripts/verificar-conteiner.sh

      - name: Logs
        if: ${{ failure() }}
        run: docker compose logs --no-color

      - name: Derrubar o compose
        if: ${{ always() }}
        run: docker compose down --volumes

  publicar:
    name: publicar
    if: ${{ github.event_name == 'push' }}
    needs: [ci, imagem]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7

      - name: Versão da tag igual à do projeto
        if: ${{ github.ref_type == 'tag' }}
        run: |
          versao=$(grep -oP '(?<=<VersionPrefix>)[^<]+' Directory.Build.props)
          [ "v$versao" = "$GITHUB_REF_NAME" ] || { echo "A tag $GITHUB_REF_NAME não corresponde ao VersionPrefix $versao"; exit 1; }

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: metadados
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=sha,prefix=sha-,format=short,enable=${{ github.ref_type == 'branch' }}
            type=semver,pattern={{version}}

      - id: publicacao
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.metadados.outputs.tags }}
          labels: ${{ steps.metadados.outputs.labels }}
          cache-from: type=gha
          provenance: mode=max
          sbom: true

      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.publicacao.outputs.digest }}
          push-to-registry: true

      - name: Resumo
        run: |
          {
            echo "## Imagem publicada"
            echo
            echo "${{ steps.metadados.outputs.tags }}" | sed 's/^/- `/; s/$/`/'
            echo "- digest: \`${{ steps.publicacao.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
